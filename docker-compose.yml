# ═══════════════════════════════════════════════════════════════
# CloudPilot — local development stack
# `make dev` brings up everything. ARM64-compatible images.
# ═══════════════════════════════════════════════════════════════
services:

  postgres:
    image: postgres:16-alpine
    container_name: cloudpilot-postgres
    environment:
      POSTGRES_DB: cloudpilot
      POSTGRES_USER: cp
      POSTGRES_PASSWORD: cp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cp -d cloudpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cloudpilot-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  chromadb:
    # Pinned deliberately, and must stay in lockstep with the `chromadb` client pinned
    # in backend/pyproject.toml. `:latest` drifted to a 1.x server that removed the v1
    # API the 0.5 client speaks, so every connection 410'd and the RAG engine silently
    # fell back to its in-memory store — the knowledge base looked fine but never
    # persisted. Bump both together or not at all.
    image: chromadb/chroma:0.5.23
    container_name: cloudpilot-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped

  # Local LLM. Capped deliberately: Docker Desktop passes no GPU through on
  # Apple Silicon, so this runs a 3B model on pure CPU and will otherwise
  # saturate every core it is allowed for minutes at a time. Measured on an
  # 8-core M-series: ~460s for one RAG answer, which is slower than the
  # request timeout — the Advisor falls back rather than answering.
  #
  # For a genuinely usable Advisor, run Ollama on the *host* instead (it gets
  # Metal acceleration there) and point the backend at it:
  #   brew install ollama && ollama serve
  #   OLLAMA_BASE_URL=http://host.docker.internal:11434
  # See docs/development.md.
  ollama:
    image: ollama/ollama:latest
    container_name: cloudpilot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama/models
    environment:
      OLLAMA_HOST: 0.0.0.0
      # Keep one core free for the rest of the stack and the machine.
      OLLAMA_NUM_PARALLEL: "1"
      # Unload the model shortly after use instead of holding ~2 GB resident.
      OLLAMA_KEEP_ALIVE: "60s"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 3g
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudpilot-backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn cloudpilot.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cp:cp@postgres:5432/cloudpilot
      REDIS_URL: redis://redis:6379/0
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: "8000"
      # Override in .env to point at a host-run Ollama (much faster on
      # Apple Silicon, which gets Metal there but not inside Docker):
      #   OLLAMA_BASE_URL=http://host.docker.internal:11434
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudpilot-scheduler
    command: python -m cloudpilot.ai.orchestrator
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cp:cp@postgres:5432/cloudpilot
      REDIS_URL: redis://redis:6379/0
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: "8000"
      # Override in .env to point at a host-run Ollama (much faster on
      # Apple Silicon, which gets Metal there but not inside Docker):
      #   OLLAMA_BASE_URL=http://host.docker.internal:11434
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: cloudpilot-frontend
    command: pnpm dev --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: cloudpilot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: cloudpilot-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-cloudpilot}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  grafana_data:
  ollama_models:
