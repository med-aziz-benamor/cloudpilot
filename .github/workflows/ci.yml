name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==1.8.2

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Ruff (lint)
        run: poetry run ruff check cloudpilot

      - name: Mypy (type check)
        run: poetry run mypy cloudpilot
        continue-on-error: true

      - name: Pytest
        run: poetry run pytest -q
        env:
          DEMO_MODE: "true"
          JWT_SECRET: "ci-secret-key-at-least-32-chars-long!!"
          FERNET_MASTER_KEY: "dGVzdC1mZXJuZXQta2V5LTMyLWJ5dGVzLWxvbmchMTI="

  frontend:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.1.4 --activate

      - name: Install dependencies
        run: pnpm install

      - name: ESLint
        run: pnpm lint
        continue-on-error: true

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
