[tool.poetry]
name = "cloudpilot"
version = "1.0.0"
description = "AI-powered FinOps & Cloud Intelligence platform — EY Tunisie IA & Data"
authors = ["Mohammed Aziz Ben Amor <mohammedaziz.benamor@esprit.tn>"]
readme = "../README.md"
packages = [{ include = "cloudpilot" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.29" }
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = {version = "^2.6.4", extras = ["email"]}
pydantic-settings = "^2.2.1"
email-validator = "^2.1.1"
apscheduler = "^3.10.4"
pyjwt = "^2.8.0"
bcrypt = "^4.1.2"
cryptography = "^42.0.5"
redis = "^5.0.3"
httpx = "^0.27.0"
loguru = "^0.7.2"
python-dotenv = "^1.0.1"
python-multipart = "^0.0.9"
prometheus-client = "^0.20.0"

# AI / ML
langchain = "^0.2.0"
langchain-community = "^0.2.0"
ollama = "^0.2.0"
chromadb = "^0.5.0"
prophet = "^1.1.5"
scikit-learn = "^1.5.0"
numpy = "^1.26.4"
pandas = "^2.2.1"

# Cloud SDKs
azure-mgmt-costmanagement = "^4.0.1"
azure-mgmt-monitor = "^6.0.2"
azure-mgmt-compute = "^31.0.0"
azure-identity = "^1.16.0"
boto3 = "^1.34.0"
google-cloud-billing = "^1.13.0"
google-cloud-monitoring = "^2.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
aiosqlite = "^0.20.0"
ruff = "^0.4.0"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ─── Ruff ─────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["cloudpilot"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["B008"]  # B008: FastAPI Depends() in defaults is the documented pattern

[tool.ruff.lint.isort]
known-first-party = ["cloudpilot"]

# ─── Mypy ─────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

# ─── Pytest ───────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
