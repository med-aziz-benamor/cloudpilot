# Prometheus scrape configuration for CloudPilot.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: cloudpilot

scrape_configs:
  - job_name: "cloudpilot-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
