apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cloudpilot
  labels: { app: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/med-aziz-benamor/cloudpilot-backend:latest
          command: ["sh", "-c", "alembic upgrade head && uvicorn cloudpilot.main:app --host 0.0.0.0 --port 8000 --workers 4"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: cloudpilot-config }
            - secretRef: { name: cloudpilot-secrets }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cloudpilot
spec:
  selector: { app: backend }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: cloudpilot
  labels: { app: scheduler }
spec:
  replicas: 1 # single scheduler instance to avoid duplicate agent runs
  selector:
    matchLabels: { app: scheduler }
  template:
    metadata:
      labels: { app: scheduler }
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/med-aziz-benamor/cloudpilot-backend:latest
          command: ["python", "-m", "cloudpilot.ai.orchestrator"]
          envFrom:
            - configMapRef: { name: cloudpilot-config }
            - secretRef: { name: cloudpilot-secrets }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
