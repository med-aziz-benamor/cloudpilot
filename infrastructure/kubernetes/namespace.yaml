apiVersion: v1
kind: Namespace
metadata:
  name: cloudpilot
  labels:
    app.kubernetes.io/name: cloudpilot
    app.kubernetes.io/part-of: cloudpilot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudpilot-config
  namespace: cloudpilot
data:
  APP_ENV: "production"
  DEMO_MODE: "true"
  OLLAMA_MODEL: "qwen2.5:4b"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"
  CHROMADB_HOST: "chromadb"
  CHROMADB_PORT: "8000"
  CORS_ORIGINS: "https://cloudpilot.example.com"
---
# Secrets are placeholders — populate via a sealed-secrets/External Secrets operator.
apiVersion: v1
kind: Secret
metadata:
  name: cloudpilot-secrets
  namespace: cloudpilot
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production-min-32-chars-long"
  FERNET_MASTER_KEY: "change-me-base64url-32-bytes"
  DATABASE_URL: "postgresql+asyncpg://cp:cp@postgres:5432/cloudpilot"
  REDIS_URL: "redis://redis:6379/0"
